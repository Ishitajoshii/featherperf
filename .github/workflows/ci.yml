name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Workspace
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Build Astro Demo
        run: pnpm --filter featherperf-demo-site build

      - name: Verify Package Archives
        run: pnpm verify:pack
